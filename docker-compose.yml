services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: varta
      POSTGRES_PASSWORD: varta
      POSTGRES_DB: varta
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      # Postgres 18 images expect the mount at /var/lib/postgresql (not /data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varta -d varta"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports: ["${VALKEY_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO release 2025-09-07T16-13-09Z, pinned by digest (Docker Hub has no dated tags)
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    # mc release 2025-08-13T08-35-41Z, pinned by digest
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/varta-media;
      exit 0;"

volumes:
  pgdata:
  miniodata:
