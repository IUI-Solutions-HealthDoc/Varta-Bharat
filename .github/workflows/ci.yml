name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: varta
          POSTGRES_PASSWORD: varta
          POSTGRES_DB: varta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U varta -d varta"
          --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://varta:varta@localhost:5432/varta
      TEST_DATABASE_URL: postgresql://varta:varta@localhost:5432/varta_test
      VALKEY_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Migration up / down / up on a fresh database
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Tests
        run: uv run pytest -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan repository history
        run: gitleaks detect --source . --redact --verbose
